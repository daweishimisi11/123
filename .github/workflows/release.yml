name: Release APK

# 触发方式：
# 1. 推送 v 开头的 tag（如 v0.1.0）——发布正式 Release
# 2. Actions 页面手动触发并填写版本号——自动创建同名 tag 并发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（需以 v 开头，如 v0.1.0），会自动创建对应 tag'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag="${{ github.event.inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          # 版本名去掉 v 前缀；versionCode 用 workflow run number，保证每次发布递增
          name="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            msg="未配置 KEYSTORE_BASE64 等签名 Secrets，请在仓库 Settings → Secrets and variables → Actions 中添加"
            echo "$msg" > /tmp/step_error.log
            echo "::error::$msg"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build signed release APK
        env:
          # 注意：Gradle 的 file() 在 app 模块内按模块目录解析，
          # jks 解码于 <root>/app/release.jks，故此处用模块相对路径
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x ./gradlew
          # 发布前强制跑 lint + 单测，避免带病发版
          ./gradlew lintDebug testDebugUnitTest assembleRelease --stacktrace \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }} 2>&1 | tee /tmp/gradle.log

      - name: Verify signed APK
        run: |
          set -o pipefail
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>&1 | tee /tmp/verify.log

      - name: Rename APK with version
        # 资产名同样带 v 前缀：123-v0.1.1.apk
        run: cp app/build/outputs/apk/release/app-release.apk "123-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # 发布标题与 tag 一致（v0.1.1），不再拼 "123 0.1.1"
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: true
          files: 123-*.apk

      - name: Notify Telegram on Release
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          tag = os.environ["RELEASE_TAG"]
          gh_token = os.environ["GITHUB_TOKEN"]
          tg_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          release_url = f"{server}/{repo}/releases/tag/{tag}"
          apk_url = f"{server}/{repo}/releases/download/{tag}/123-{tag}.apk"
          notes = ""
          is_prerelease = "-" in tag

          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "github-actions-telegram-notifier",
                  },
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
              release_url = data.get("html_url") or release_url
              is_prerelease = bool(data.get("prerelease", is_prerelease))
              notes = (data.get("body") or "").strip()
              for asset in data.get("assets", []):
                  if asset.get("name", "").endswith(".apk") and asset.get("browser_download_url"):
                      apk_url = asset["browser_download_url"]
                      break
          except Exception as exc:
              print(f"Warning: failed to query GitHub release metadata: {exc}")

          if not notes:
              notes = "暂无更新日志"
          if len(notes) > 3200:
              notes = notes[:3200].rstrip() + "\n\n...(完整更新日志请点击下方「查看详情」)"

          badge = " 🧪 <i>(测试版)</i>" if is_prerelease else ""
          text = (
              f"🚀 <b>123 {html.escape(tag)} 已发布</b>{badge}\n\n"
              f"<b>📝 更新日志</b>\n"
              f"{html.escape(notes)}"
          )

          payload = {
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
              "reply_markup": {
                  "inline_keyboard": [
                      [
                          {"text": "⬇️ 直接下载 APK", "url": apk_url},
                          {"text": "📋 查看详情", "url": release_url},
                      ]
                  ]
              },
          }

          tg_req = urllib.request.Request(
              f"https://api.telegram.org/bot{tg_token}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(tg_req, timeout=20) as resp:
              print(resp.read().decode("utf-8"))
          PY

      - name: Notify Telegram on Failure
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          run_id = os.environ["GITHUB_RUN_ID"]
          ref_label = os.environ.get("RELEASE_TAG") or os.environ.get("GITHUB_REF_NAME", "unknown")
          gh_token = os.environ["GITHUB_TOKEN"]
          tg_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          run_url = f"{server}/{repo}/actions/runs/{run_id}"
          failed_step = "未知步骤"

          try:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs",
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "github-actions-telegram-notifier",
                  },
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  jobs_data = json.loads(resp.read().decode("utf-8"))
              for job in jobs_data.get("jobs", []):
                  for step in job.get("steps", []):
                      if step.get("conclusion") == "failure":
                          failed_step = step.get("name") or failed_step
                          if job.get("html_url"):
                              run_url = job["html_url"]
                          break
                  if failed_step != "未知步骤":
                      break
          except Exception as exc:
              print(f"Warning: failed to query failed step metadata: {exc}")

          error_excerpt = ""
          step_err = pathlib.Path("/tmp/step_error.log")
          gradle_log = pathlib.Path("/tmp/gradle.log")
          verify_log = pathlib.Path("/tmp/verify.log")

          if step_err.exists():
              error_excerpt = step_err.read_text(encoding="utf-8", errors="replace").strip()
          elif failed_step == "Build signed release APK" and gradle_log.exists():
              lines = gradle_log.read_text(encoding="utf-8", errors="replace").splitlines()
              failure_idx = next((i for i, line in enumerate(lines) if "FAILURE:" in line), None)
              if failure_idx is not None:
                  snippet_lines = lines[failure_idx:]
              else:
                  snippet_lines = [line for line in lines if line.strip()][-25:]
              error_excerpt = "\n".join(snippet_lines).strip()
          elif failed_step == "Verify signed APK" and verify_log.exists():
              lines = [line for line in verify_log.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
              error_excerpt = "\n".join(lines[-20:]).strip()
          elif failed_step == "未知步骤" and gradle_log.exists():
              lines = [line for line in gradle_log.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
              error_excerpt = "\n".join(lines[-20:]).strip()

          if not error_excerpt:
              error_excerpt = f"步骤「{failed_step}」执行失败，请点击下方按钮查看完整运行日志。"
          elif len(error_excerpt) > 2500:
              error_excerpt = "...\n" + error_excerpt[-2500:]

          text = (
              f"❌ <b>123 Release 构建失败</b>\n\n"
              f"<b>版本 / 分支：</b><code>{html.escape(ref_label)}</code>\n"
              f"<b>失败步骤：</b><code>{html.escape(failed_step)}</code>\n\n"
              f"<b>报错信息：</b>\n"
              f"<pre><code>{html.escape(error_excerpt)}</code></pre>"
          )

          payload = {
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
              "reply_markup": {
                  "inline_keyboard": [
                      [
                          {"text": "🔍 查看失败日志", "url": run_url},
                      ]
                  ]
              },
          }

          tg_req = urllib.request.Request(
              f"https://api.telegram.org/bot{tg_token}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(tg_req, timeout=20) as resp:
              print(resp.read().decode("utf-8"))
          PY
